[package]
name = "wanderer-desktop"
version = "0.1.2"
description = "Wanderer EVE map desktop shell"
authors = ["Wanderer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wanderer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Used to verify the server address against `/desktop/update.json`. `native-tls`
# uses the Windows certificate store (schannel), so a CA the user trusts for
# WebView2 is trusted here too; `system-proxy` matches the WebView's proxy.
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
